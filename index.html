<!DOCTYPE html>
<html>
<head>
    <title>Game Dorong Bar</title>
    <style>
        body {
            background-color: lightblue;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }

        /* Styling untuk container bar */
        #bar-container {
            width: 80vw;
            height: 50px;
            border: 4px solid black;
            display: flex;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.3);
        }

        #blue-bar {
            width: 50%;
            background-color: #2196F3;
            transition: width 0.05s linear;
        }

        #red-bar {
            width: 50%;
            background-color: #F44336;
            transition: width 0.05s linear;
        }

        /* Tombol Utama (GO / SPAM) */
        #action-btn {
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            border: 2px solid black;
            background-color: white;
            transition: background-color 0.2s;
        }

        #action-btn:active {
            background-color: #ddd;
        }
        
        /* Tombol Reset */
        #reset-btn {
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            border: 2px solid black;
            background-color: #ff9800; 
            color: white;
            display: none; 
        }

        #status-text {
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="status-text">Siap-siap...</div>

    <div id="bar-container">
        <div id="blue-bar"></div>
        <div id="red-bar"></div>
    </div>

    <button id="action-btn">GO!</button>
    <button id="reset-btn">Main Lagi!</button>

    <script>
        let blueBar = document.getElementById("blue-bar");
        let redBar = document.getElementById("red-bar");
        let actionBtn = document.getElementById("action-btn");
        let resetBtn = document.getElementById("reset-btn"); 
        let statusText = document.getElementById("status-text");

        let playerPower = 50; 
        let gameInterval; 
        let isPlaying = false; 

        // 1. Deteksi Klik Mouse
        actionBtn.addEventListener("click", function(event) {
            // Mencegah tombol tetap "fokus" setelah diklik
            // Biar kalau kita pencet spasi setelahnya, nggak dobel klik
            actionBtn.blur(); 

            if (!isPlaying && actionBtn.innerHTML === "GO!") {
                startGame();
            } else if (isPlaying) {
                spamPush();
            }
        });

        // 2. Deteksi Ketikan Keyboard (Tombol Spasi)
        document.addEventListener("keydown", function(event) {
            // Mengecek apakah tombol yang ditekan adalah Spasi
            if (event.code === "Space") {
                event.preventDefault(); // Mencegah layar scroll ke bawah saat spasi ditekan

                if (!isPlaying && actionBtn.style.display !== "none" && actionBtn.innerHTML === "GO!") {
                    startGame(); // Mulai game pakai spasi
                } else if (isPlaying) {
                    spamPush(); // Spam dorong pakai spasi
                }
            }
        });

        // 3. Tombol Reset
        resetBtn.addEventListener("click", resetGame);

        function startGame() {
            isPlaying = true;
            actionBtn.innerHTML = "SPAM KLIK / SPASI!!"; // Update teks biar user tau bisa pakai spasi
            actionBtn.style.backgroundColor = "#ffeb3b"; 
            statusText.innerHTML = "Ayo dorong!!";

            gameInterval = setInterval(function() {
                playerPower -= 4; 
                updateBar();
                checkWinCondition();
            }, 100); 
        }

        function spamPush() {
            playerPower += 4; 
            updateBar();
            checkWinCondition();
        }

        function updateBar() {
            if (playerPower > 100) playerPower = 100;
            if (playerPower < 0) playerPower = 0;

            blueBar.style.width = playerPower + "%";
            redBar.style.width = (100 - playerPower) + "%";
        }

        function checkWinCondition() {
            if (playerPower >= 100) {
                endGame("Kamu Menang! 🎉 Dominasi Biru!");
            } else if (playerPower <= 0) {
                endGame("Kalah!");
            }
        }

        function endGame(message) {
            isPlaying = false;
            clearInterval(gameInterval); 
            statusText.innerHTML = message;
            
            actionBtn.style.display = "none";
            
            setTimeout(function() {
                resetBtn.style.display = "block";
            }, 3000);
        }

        function resetGame() {
            playerPower = 50;
            updateBar();
            statusText.innerHTML = "Siap-siap...";
            
            resetBtn.style.display = "none";
            actionBtn.style.display = "block";
            actionBtn.innerHTML = "GO!";
            actionBtn.style.backgroundColor = "white";
        }
    </script>

</body>
</html>
